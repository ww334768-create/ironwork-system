<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨手機即時同步頁面</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f4f6f8; }
    h2 { color: #333; text-align: center; margin-bottom: 20px; }
    .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #aaa; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: white; padding: 14px 16px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 16px; word-break: break-all; }
    .status { text-align: center; color: #666; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>📱 跨手機同步清單</h2>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="請輸入要新增的內容...">
    <button id="sendBtn" onclick="addData()">新增</button>
  </div>

  <div id="status" class="status">正在讀取雲端資料...</div>
  <ul id="dataList"></ul>

  <script>
    // 你的專屬 Google Sheet API 連結
    const API_URL = "https://script.google.com/macros/s/AKfycbxsly23moU4OMHkphFlWw3jYUKsoCusS1-DE2j7sN-nvTGMTG_HV7TfAOPxxz7vbSr9/exec";

    // 1. 讀取資料
    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const list = document.getElementById("dataList");
        list.innerHTML = "";
        
        // 讓最新新增的顯示在最上面
        data.reverse().forEach(item => {
          if (item.content) {
            let li = document.createElement("li");
            li.textContent = item.content;
            list.appendChild(li);
          }
        });
        document.getElementById("status").style.display = "none";
      } catch (err) {
        document.getElementById("status").textContent = "載入資料失敗，請重新整理頁面";
      }
    }

    // 2. 新增資料
    async function addData() {
      const input = document.getElementById("userInput");
      const btn = document.getElementById("sendBtn");
      const status = document.getElementById("status");
      const content = input.value.trim();
      
      if (!content) return;

      btn.disabled = true;
      btn.textContent = "傳送中...";
      status.style.display = "block";
      status.textContent = "同步上傳中...";

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ content: content })
        });

        input.value = "";
        btn.disabled = false;
        btn.textContent = "新增";
        
        // 重新更新列表
        loadData();
      } catch (err) {
        alert("新增失敗，請再試一次");
        btn.disabled = false;
        btn.textContent = "新增";
      }
    }

    // 開啟網頁時自動執行載入
    loadData();
  </script>
</body>
</html>
